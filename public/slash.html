<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slash proof · Lelang</title>
<meta name="description" content="A supplier agent tried to manipulate an AI tender evaluator. Its bond was slashed on Kite testnet with the evidence hash on-chain. Verify it yourself in your browser.">
<link rel="icon" href="data:,">
<style>
  :root { --bg:#f6f5f1; --card:#fff; --ink:#1c1b18; --mute:#6b6860; --line:#e3e0d8; --ok:#1f7a4d; --bad:#b3261e; --warn:#a15c00; --acc:#2b4acb; --mark:#fde68a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141412; --card:#1d1d1a; --ink:#ecebe6; --mute:#9d9a91; --line:#2e2d29; --ok:#4cc38a; --bad:#ff7a6e; --warn:#f0b35a; --acc:#8ea2ff; --mark:#6b5310; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 ui-sans-serif, system-ui, sans-serif; }
  main { max-width:820px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:26px; letter-spacing:-.02em; margin:8px 0 4px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--mute); margin:28px 0 10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .kv { font-size:13px; color:var(--mute); }
  .ok { color:var(--ok); } .bad { color:var(--bad); } .warn { color:var(--warn); }
  a { color:var(--acc); }
  pre { white-space:pre-wrap; overflow-wrap:anywhere; font:13px/1.55 ui-monospace, monospace; margin:0; }
  mark { background:var(--mark); color:inherit; border-radius:3px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  td code { overflow-wrap:anywhere; font-size:12px; }
  button { background:var(--ink); color:var(--bg); border:0; border-radius:8px; padding:10px 16px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  @media (max-width:600px) { th, td { display:block; border:0; padding:2px 0; } tr { display:block; padding:8px 0; border-bottom:1px solid var(--line); } }
</style>
</head>
<body>
<main>
  <a href="./" class="kv">← all tenders</a>
  <div id="view"><p class="kv">Loading…</p></div>
</main>
<script type="module" src="slash.js"></script>
</body>
</html>
