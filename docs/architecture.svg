<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 664" width="1000" height="664" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Lelang architecture</title>
  <desc id="d">Supplier agents commit sealed bids and bonds to the LelangEscrow contract on Kite. The Lelang server reads each revealed bid through SERV and Dolphin, decides with a published formula and an independent decision node, has Reppo audit the award, and settles everything in one escrow transaction. Reputation and proofs are read back from the chain.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b5952"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b3261e"/></marker>
    <style>
      .box { fill: #fff; stroke: #cfcbc1; stroke-width: 1.2; }
      .kite { fill: #eef2ff; stroke: #6b7fd7; }
      .ai { fill: #f4f9f4; stroke: #7cae86; }
      .gate { fill: #fff7ea; stroke: #d7a24a; }
      .bad { fill: #fdf0ef; stroke: #d98b84; }
      .h { font-size: 15px; font-weight: 700; fill: #1c1b18; }
      .s { font-size: 12px; fill: #4a4842; }
      .l { font-size: 11.5px; fill: #5b5952; }
      .lr { font-size: 11.5px; fill: #b3261e; font-weight: 600; }
      .sec { font-size: 12px; font-weight: 700; fill: #8a867c; letter-spacing: .08em; }
      .ln { stroke: #5b5952; stroke-width: 1.4; fill: none; }
      .lnr { stroke: #b3261e; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
    </style>
  </defs>
  <rect width="1000" height="664" fill="#f8f7f3"/>

  <text x="24" y="34" class="sec">AGENTS</text>
  <text x="300" y="34" class="sec">LELANG SERVER: EVERY REVEALED BID</text>
  <text x="742" y="34" class="sec">KITE TESTNET</text>

  <g transform="translate(0,24)">
  <!-- agents -->
  <rect x="24" y="50" width="230" height="96" rx="10" class="box"/>
  <text x="38" y="74" class="h">Supplier agents</text>
  <text x="38" y="94" class="s">own keys; bid over HTTP or MCP</text>
  <text x="38" y="112" class="s">commit keccak(doc, salt, bidder, id)</text>
  <text x="38" y="130" class="s">+ bond (base × 2ⁿ after n slashes)</text>

  <rect x="24" y="176" width="230" height="96" rx="10" class="box"/>
  <text x="38" y="200" class="h">Buyer agent</text>
  <text x="38" y="220" class="s">opens a tender: pays the fee over</text>
  <text x="38" y="238" class="s">x402 (PYUSD on Kite, USDC on Arc)</text>
  <text x="38" y="256" class="s">gets an owner token to run it</text>

  <rect x="24" y="302" width="230" height="78" rx="10" class="box"/>
  <text x="38" y="326" class="h">Named approver</text>
  <text x="38" y="346" class="s">releases held money and decides</text>
  <text x="38" y="364" class="s">appeals with an EIP-191 signature</text>

  <!-- pipeline -->
  <rect x="300" y="50" width="400" height="52" rx="10" class="gate"/>
  <text x="314" y="72" class="h">1 · Spotlight + SERV Prompt Guard</text>
  <text x="314" y="91" class="s">untrusted text datamarked; a guard block alone only holds the bid</text>

  <rect x="300" y="114" width="400" height="66" rx="10" class="ai"/>
  <text x="314" y="136" class="h">2 · Manipulation check (SERV decision node)</text>
  <text x="314" y="155" class="s">quote found verbatim in the document AND a second check that it</text>
  <text x="314" y="171" class="s">speaks to the evaluator → disqualify + slash; otherwise a human looks</text>

  <rect x="300" y="192" width="400" height="66" rx="10" class="ai"/>
  <text x="314" y="214" class="h">3 · Two readers + ambiguity check</text>
  <text x="314" y="233" class="s">Dolphin reads the terms, SERV re-reads: any difference holds the bid;</text>
  <text x="314" y="249" class="s">two figures for one term holds it too (found by our adaptive attacker)</text>

  <rect x="300" y="270" width="400" height="66" rx="10" class="gate"/>
  <text x="314" y="292" class="h">4 · Rules, formula, decision node</text>
  <text x="314" y="311" class="s">hard rules in code; published formula and an independent decision</text>
  <text x="314" y="327" class="s">node must pick the same winner, or the tender escalates to a human</text>

  <rect x="300" y="348" width="400" height="66" rx="10" class="ai"/>
  <text x="314" y="370" class="h">5 · Reppo audit (strictest round counts)</text>
  <text x="314" y="389" class="s">SERV writes the rationale (Kronos + Shadow Agent); the Reppo panel</text>
  <text x="314" y="405" class="s">must ship it; a rewritten rationale is measured, never loosens the gate</text>

  <path d="M500 102 V112 M500 180 V190 M500 258 V268 M500 336 V346" class="ln" marker-end="url(#a)"/>

  <!-- kite -->
  <rect x="742" y="50" width="234" height="148" rx="10" class="kite"/>
  <text x="756" y="74" class="h">LelangEscrow (V3)</text>
  <text x="756" y="94" class="s">holds sealed commitments and</text>
  <text x="756" y="111" class="s">per-bidder bonds; no owner, no admin</text>
  <text x="756" y="135" class="s">settle, one transaction:</text>
  <text x="756" y="152" class="s">· refunds  · slashes with keccak(quote)</text>
  <text x="756" y="169" class="s">· down payment to the winner</text>
  <text x="756" y="186" class="s">· success fee to the treasury</text>

  <rect x="742" y="226" width="234" height="96" rx="10" class="kite"/>
  <text x="756" y="250" class="h">Reputation from events</text>
  <text x="756" y="270" class="s">BondSlashed across V1–V3, trusted</text>
  <text x="756" y="287" class="s">buyers only, overturned slashes</text>
  <text x="756" y="304" class="s">dropped → bond quote base × 2ⁿ</text>

  <rect x="742" y="350" width="234" height="64" rx="10" class="kite"/>
  <text x="756" y="374" class="h">x402 fees</text>
  <text x="756" y="393" class="s">EIP-3009 · facilitator, or self-settle</text>
  <text x="756" y="408" class="s">· each payment nonce accepted once</text>

  </g>
  <!-- lanes (absolute coordinates) -->
  <path d="M200 74 V50 H860 V71" class="ln" marker-end="url(#a)"/>
  <text x="420" y="45" class="l">commit + bond, then reveal: from the supplier's own wallet</text>
  <path d="M254 140 H297" class="ln" marker-end="url(#a)"/>
  <path d="M254 248 H280 V458 H731 V406 H739" class="ln" marker-end="url(#a)"/>
  <text x="420" y="473" class="l">tender fee: a signed EIP-3009 authorization, no gas</text>
  <path d="M700 405 H716 V150 H739" class="ln" marker-end="url(#a)"/>
  <text x="702" y="424" class="l">settle</text>
  <path d="M742 300 H727 V62 H266 V112 H257" class="lnr" marker-end="url(#r)"/>
  <text x="732" y="246" class="lr" transform="rotate(-90 732 246)">bond quote</text>
  <g transform="translate(0,24)">
  <!-- public -->
  <text x="24" y="460" class="sec">ANYONE, IN A BROWSER</text>
  <rect x="24" y="470" width="952" height="146" rx="10" class="box"/>
  <rect x="40" y="486" width="220" height="114" rx="8" class="bad"/>
  <text x="54" y="510" class="h">Proof page per slash</text>
  <text x="54" y="530" class="s">hidden text highlighted; the</text>
  <text x="54" y="547" class="s">browser hashes quote and</text>
  <text x="54" y="564" class="s">document and compares them</text>
  <text x="54" y="581" class="s">with the escrow on Kite</text>
  <rect x="276" y="486" width="220" height="114" rx="8" class="kite"/>
  <text x="290" y="510" class="h">Dashboard</text>
  <text x="290" y="530" class="s">every settled tender re-checked</text>
  <text x="290" y="547" class="s">against the settle tx; OCDS 1.1.5</text>
  <text x="290" y="564" class="s">export per tender</text>
  <rect x="512" y="486" width="220" height="114" rx="8" class="kite"/>
  <text x="526" y="510" class="h">Reputation page + feed</text>
  <text x="526" y="530" class="s">any address: slash history and</text>
  <text x="526" y="547" class="s">bond price read from Kite;</text>
  <text x="526" y="564" class="s">reputation.json for marketplaces</text>
  <rect x="748" y="486" width="212" height="114" rx="8" class="gate"/>
  <text x="762" y="510" class="h">Attack gallery</text>
  <text x="762" y="530" class="s">every attack we ran, word for</text>
  <text x="762" y="547" class="s">word, with its outcome; appeals</text>
  <text x="762" y="564" class="s">and our own false slash, public</text>
  </g>
</svg>
